[package]
name = "Storage"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "list_objects_path"
path = "src/bin/list_objects_path.rs"

[dependencies]
aws-sdk-s3 = {version = "1.144.0", features = ["behavior-version-latest"] }
aws-config = { version = "1.10.1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.3", features = ["hardcoded-credentials"] }
bytes = "1.12.1"
tokio = { version = "1.53.0", features = ["full"] }
thiserror = "2.0.19"
log = "0.4.33"
reqwest = { version = "0.13.3", features = ["stream", "json", "blocking"] }
aws-smithy-types = "1.6.2"
indicatif = "0.18.6"
dotenvy = "0.15.7"
